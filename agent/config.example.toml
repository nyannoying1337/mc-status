# The agent's settings. `python setup.py` creates agent/config.toml from this
# file and fills in the Worker URL and token; edit the rest by hand if you like.
# config.toml is gitignored: it holds the push token.

[site]
# Where your status page lives. Only used to print invite links.
url = "https://your-name.github.io/mc-status/"
# The name shown on the page. setup.py pushes it to the MCS_SITE_NAME repository
# variable, and remembers it here so running setup again doesn't rename the page.
name = "My Minecraft"

[worker]
# Where the Cloudflare Worker runs: https://mc-status.<you>.workers.dev or your own domain.
url = "https://mc-status.your-account.workers.dev"
# The Worker's PUSH_TOKEN secret. setup.py generates and stores both.
token = "change-me"

[agent]
# How often to push while you're in game, and while you're not.
interval_seconds = 10
offline_interval_seconds = 60
# Time in game per day is kept here (default: agent/playtime.json).
# playtime_file = "~/mc-status-playtime.json"
# The day's timeline is kept here (default: agent/events.json). Ten days are
# stored; the last day is published.
# events_file = "~/mc-status-events.json"

[source]
# "mod"  — singleplayer: the mc-status Fabric mod writes your state, and runs
#          curses in your world. Needs the mod installed.
# "rcon" — a server you run: the agent asks it over RCON (see [rcon]).
type = "mod"
# Where the game lives. Default: %APPDATA%/.minecraft on Windows,
# ~/Library/Application Support/minecraft on macOS, ~/.minecraft elsewhere.
# game_dir = "%APPDATA%/.minecraft"
# Instances of Prism, the Modrinth App, CurseForge and GDLauncher are found on
# their own, and the one played last is read. For another launcher, list them:
# game_dir = ["%APPDATA%/.minecraft", "D:/Games/modpack/.minecraft"]
# find_instances = true

[rcon]
# Only used with source.type = "rcon".
host = "127.0.0.1"
port = 25575
password = "your-rcon-password"
# Exact in-game name. RCON only works on servers you control.
player = "YourName"

[screenshot]
# With the mod, its HUD-free frame <game_dir>/mc-status/latest.png is used and
# F2 screenshots are never published. For a server, set a folder to take the
# newest image from.
# directory = "~/.minecraft/screenshots"
max_width = 1920
quality = 82

[shots]
# Keep a thinned archive of the mod's frames, and publish a window of it to the
# repo's `shots` branch for the timeline on the page. Needs git push access.
keep = false
publish = false
# One frame kept per this many seconds, at most.
every_seconds = 300
# Where the local archive lives (default: agent/shots). Thirty days are kept
# here; ten are published. The local copy is the only undo — publishing replaces
# the branch wholesale, so what rolls out of the published window is gone.
# directory = "~/mc-status-shots"

[map]
# When you log out, render the area around where you were and publish it to
# the repo's `map` branch (see map/render.py). Needs Java 25+ and git push access.
render_on_logout = false
radius_chunks = 8
# BlueMap downloads textures from the Minecraft client jar. Setting this means
# you own the game and accept Mojang's EULA (https://www.minecraft.net/eula).
accept_mojang_eula = false
publish = true
# The git remote the map branch is pushed to.
# remote = "origin"
# Found automatically (JAVA_HOME, PATH, or the Minecraft launcher's own Java).
# java = "C:/path/to/java.exe"
# For a server (rcon source), point at its world folder:
# world = "/srv/minecraft/world"

[privacy]
# Hides your coordinates on the page, the map marker and the death marker. The
# logout map still renders around your position: turn render_on_logout off if
# that's a concern.
hide_coordinates = false
# Publish where you are, and frames of what you see, while on someone else's
# server. Off by default: coordinates on a shared world are a route to your base,
# and a frame can hold other players' builds and nametags. The mod has its own
# share_server_world switch — both have to be on. Statistics and advancements
# stay off regardless: the client can't read them on a server.
share_server_world = false

[cursed]
# The machine reaches into the world. Off until you mean it: these run real
# commands in your world. Try them on a copy first; fire spreads.
#
# `when` is "<metric> <op> <number>". Metrics: cpu_percent, gpu_percent,
# mem_percent, uptime_hours, health (0-20), foodlevel (0-20), xplevel, and
# cpu_temp, gpu_temp (°C) when fastfetch is installed and can read them.
# A rule fires when its condition holds, then again every cooldown_seconds
# while it still does. {player} becomes your in-game name.
# Run `agent.py --dry-run` to see live metrics and which rules would fire.
enabled = false

[[cursed.rules]]
name = "gpu on fire"
when = "gpu_temp >= 80"
cooldown_seconds = 120
commands = [
  'execute at {player} run fill ~-2 ~ ~-2 ~2 ~ ~2 minecraft:fire replace minecraft:air',
]

[[cursed.rules]]
name = "cpu storm"
when = "cpu_temp >= 85"
cooldown_seconds = 300
commands = ['weather thunder 120s']

[[cursed.rules]]
name = "out of ram"
when = "mem_percent >= 90"
cooldown_seconds = 60
commands = ['effect give {player} minecraft:slowness 30 1']

[[cursed.rules]]
name = "go to bed"
when = "uptime_hours >= 12"
cooldown_seconds = 1800
commands = [
  'title {player} actionbar "this pc has been up for 12 hours. go to bed."',
  'effect give {player} minecraft:nausea 15',
]
