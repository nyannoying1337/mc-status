name: Deploy site

on:
  # `map` is force-pushed by map/render.py, `shots` by agent/archive.py and `demo`
  # by setup.py; a new render, batch of frames or set of demo imagery redeploys.
  #
  # No paths filter. There used to be a paths-ignore for README and docs, which
  # only ever matched pushes to main — but each of those publishers force-pushes
  # unrelated history, and a push GitHub cannot diff, or whose tree is identical
  # to the last one, can be skipped by a paths filter with no run and no trace.
  # That happened: a map render reached the branch and never deployed. Redeploying
  # on a docs edit costs about 35 seconds; a render that silently never goes live
  # costs a lot more to notice.
  push:
    branches: [main, map, shots, demo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Always build from the default branch, even when the map branch triggered the run.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      # The page's API URL and name come from repository variables, so a fork
      # needs no code changes. Without MCS_API_URL the deploy stops here and the
      # site that's already live stays as it is.
      - name: Write site/js/config.js
        env:
          MCS_API_URL: ${{ vars.MCS_API_URL }}
          MCS_SITE_NAME: ${{ vars.MCS_SITE_NAME }}
        run: |
          if [ -z "$MCS_API_URL" ]; then
            echo "::error::Set the MCS_API_URL repository variable (Settings → Secrets and variables → Actions → Variables) to your Worker's URL. python setup.py prints it."
            exit 1
          fi
          python3 - <<'EOF'
          import json, os
          api = os.environ["MCS_API_URL"].rstrip("/")
          name = os.environ.get("MCS_SITE_NAME") or os.environ.get("GITHUB_REPOSITORY_OWNER", "Minecraft")
          with open("site/js/config.js", "w", encoding="utf-8") as f:
              f.write("// Generated by .github/workflows/pages.yml from repository variables.\n")
              f.write(f"export const API_URL = {json.dumps(api)};\nexport const SITE_NAME = {json.dumps(name)};\n")
          print(f"API_URL={api} SITE_NAME={name}")
          EOF

      - name: Add the rendered map, if there is one
        run: |
          if git ls-remote --exit-code --heads origin map > /dev/null; then
            git fetch --depth 1 origin map
            mkdir -p site/map
            git archive FETCH_HEAD | tar -x -C site/map
            echo "map: $(find site/map -type f | wc -l) files"
          else
            echo "no map branch yet — deploying without /map"
          fi

      # The ?demo imagery is pictures of the maintainer's own world, so it lives on a
      # branch rather than in the tree. Forks skip it: a fork that inherited the branch
      # would otherwise serve someone else's world as if it were its own.
      - name: Add the demo imagery, unless this is a fork
        if: github.event.repository.fork != true
        run: |
          if git ls-remote --exit-code --heads origin demo > /dev/null; then
            git fetch --depth 1 origin demo
            mkdir -p site/demo
            git archive FETCH_HEAD | tar -x -C site/demo
            rm -rf site/demo/.github
            echo "demo: $(find site/demo -name '*.webp' | wc -l) images"
          else
            echo "no demo branch — ?demo will fall back to no imagery"
          fi

      - name: Add the archived frames, if there are any
        run: |
          if git ls-remote --exit-code --heads origin shots > /dev/null; then
            git fetch --depth 1 origin shots
            mkdir -p site/shots
            git archive FETCH_HEAD | tar -x -C site/shots
            echo "shots: $(find site/shots -name '*.jpg' | wc -l) images"
          else
            echo "no shots branch yet — deploying without /shots"
          fi

      # Item icons and HUD sprites come from Mojang's client jar at deploy time,
      # so no game assets are ever committed to the repo.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: minecraft
        run: echo "version=$(sed -n 's/^MC_VERSION = "\(.*\)"/\1/p' site/build_assets.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: site/.cache
          key: mc-client-${{ steps.minecraft.outputs.version }}
      - name: Build Minecraft icons
        run: |
          pip install --quiet "Pillow>=10,<13"
          python site/build_assets.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
