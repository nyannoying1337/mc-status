name: Release mod

# Builds the mod jar and attaches it to a GitHub Release, where setup.py (and
# anyone else) can download it. Workflow artifacts expire and need a GitHub login;
# release assets don't.
#
# Either push a tag like v1.0.4, or use Run workflow and it tags the version in
# mod/gradle.properties for you.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew build
      - id: version
        run: echo "value=$(sed -n 's/^version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
      - name: Check the tag matches the mod version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          [ "v${{ steps.version.outputs.value }}" = "${GITHUB_REF_NAME}" ] \
            || { echo "::error::tag ${GITHUB_REF_NAME} but gradle.properties says ${{ steps.version.outputs.value }}"; exit 1; }
      # tag_name comes from gradle.properties rather than the ref, so Run workflow
      # creates the tag it releases. Without it the action has nothing to attach to
      # off a branch, and the run fails after a successful build.
      # prerelease and make_latest are spelled out rather than left to the action,
      # which published v1.5.0 as a pre-release on its own.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          files: mod/build/libs/mc-status-*.jar
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: false
          make_latest: true

      # Those two only take on a release the action creates. On one that already
      # exists it updates the notes and the jar and leaves the flags alone, so a
      # release published as a pre-release stays one however often it is re-run —
      # measured on v1.5.0. setup.py downloads from GitHub's "latest release",
      # which skips pre-releases, so that state hides the jar from the wizard.
      - name: Make sure it is published as a release, not a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "v${{ steps.version.outputs.value }}" \
            --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
